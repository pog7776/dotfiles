# Per-host settings. Keys are lowercase hostnames.

# tmux accent colour (current window, active pane border, hostname segment), so
# nested or side-by-side sessions show which machine they're on at a glance.
tmux_accent:
  default: "#00afff"   # light blue (the original theme colour)
  jackpad: "#00afff"
  nostromo: "#ffd700"  # gold
  firelink: "#ff8700"  # bonfire orange (was sulaco)
  system-z10: "#af87ff" # purple
  muthur: "#5fd700"    # MU/TH/UR terminal green

# SSH keys added to ~/.ssh/authorized_keys (private_dot_ssh/modify_private_authorized_keys).
# Keys are only ever added; existing ones are never removed.

# GitHub accounts whose public keys are added, by machine role.
ssh_github_users:
  - user: pog7776
    roles: [workstation, server, thin, termux]
  - user: Trickle-Charge-bot   # agents (e.g. hermes-agent@System-Z10); not on servers until their access is sorted
    roles: [workstation, thin, termux]

# Extra individual keys, by machine role.
ssh_extra_keys:
  - name: jack-agent   # Jack's key lent to agents he's driving (1Password: Agents vault). Logs in as Jack, no extra rights.
    key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHZTsYb+gQbIRSjiEGb14P+KOkAUkCt2aC/tRNEDY82v jack-agent
    roles: [server]
