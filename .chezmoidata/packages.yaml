package_managers:
  android:
    # Termux doesn't support partial upgrades; installing alone can break curl
    update: pkg upgrade -y
    install: pkg install -y
  ubuntu:
    update: sudo apt-get update
    install: sudo apt-get install -y
  debian:
    update: sudo apt-get update
    install: sudo apt-get install -y
  arch:
    install: sudo pacman -Sy --noconfirm
  fedora:
    install: sudo dnf install -y

packages:
  android:
    - perl  # Oh My Tmux needs it; distros have it already
    - openssh  # sshd, started by conf.d/termux.zsh
    - android-tools  # adb, for adb-tcp-up
    - tmux
    - fzf
    - eza
    - zoxide
    - vim
    - git
    - curl
    - zsh
    - fontconfig
  ubuntu:
    - btop
    - tmux
    - fzf
    - eza
    - zoxide
    - vim
    - git
    - curl
    - zsh
    - fontconfig
  debian:
    - btop
    - tmux
    - fzf
    - eza
    - zoxide
    - vim
    - git
    - curl
    - zsh
    - fontconfig
  arch:
