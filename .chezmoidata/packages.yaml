package_managers:
  ubuntu:
    update: "sudo apt-get update"
    install: "sudo apt-get install -y"
  debian:
    update: "sudo apt-get update"
    install: "sudo apt-get install -y"
  arch:
    install: "sudo pacman -Sy --noconfirm"
  fedora:
    install: "sudo dnf install -y"

packages:
  ubuntu:
    - btop
    - tmux
    - fzf
    - eza
    - zoxide
    - vim
    - git
    - curl
    - zsh
